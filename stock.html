<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock - Nguu Agrovet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    header {
      background: #176b3a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 15px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 7px;
      background: #555;
      color: white;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px 6px;
      text-align: left;
    }

    th {
      background: #176b3a;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>📦 STOCK</h1>
  <p>Nguu Agrovet - Kwediboma</p>
</header>

<div class="container">

  <button onclick="location.href='index.html'">
    ← Rudi Dashboard
  </button>

  <h2>Bidhaa Zilizopo</h2>

  <table>
    <tr>
      <th>Bidhaa</th>
      <th>Kiasi</th>
      <th>Bei ya Reja</th>
    </tr>

    <tr>
      <td>Faru Dust</td>
      <td>48</td>
      <td>TSh 5,000</td>
    </tr>

    <tr>
      <td>Duduba</td>
      <td>100</td>
      <td>TSh 5,000</td>
    </tr>

    <tr>
      <td>Blitkill</td>
      <td>50</td>
      <td>TSh 5,000</td>
    </tr>

    <tr>
      <td>Nuru</td>
      <td>72</td>
      <td>TSh 7,000</td>
    </tr>

    <tr>
      <td>Shamba Dust</td>
      <td>50</td>
      <td>TSh 5,000</td>
    </tr>

  </table>

</div><!-- ADD PRODUCT -->
<div style="margin:20px 0; padding:20px; background:white; border-radius:10px;">
  <h2>➕ ADD PRODUCT</h2>

  <input id="productName" type="text" placeholder="Jina la bidhaa"
         style="width:100%; padding:12px; margin:6px 0;">

  <input id="productQty" type="number" placeholder="Kiasi"
         style="width:100%; padding:12px; margin:6px 0;">

  <input id="buyPrice" type="number" placeholder="Bei ya kununua"
         style="width:100%; padding:12px; margin:6px 0;">

  <input id="sellPrice" type="number" placeholder="Bei ya reja"
         style="width:100%; padding:12px; margin:6px 0;">

  <button onclick="addProduct()"
          style="padding:12px 20px; background:#176b3a; color:white; border:0; border-radius:6px;">
    💾 SAVE PRODUCT
  </button>
</div>

<script>
function addProduct() {
  let name = document.getElementById("productName").value;
  let qty = document.getElementById("productQty").value;
  let buy = document.getElementById("buyPrice").value;
  let sell = document.getElementById("sellPrice").value;

  if (name === "" || qty === "" || buy === "" || sell === "") {
    alert("Jaza taarifa zote za bidhaa");
    return;
  }

  let products = JSON.parse(localStorage.getItem("nguuProducts")) || [];

  let product = {
    name: name,
    qty: qty,
    buy: buy,
    sell: sell
  };

  products.push(product);
  localStorage.setItem("nguuProducts", JSON.stringify(products));

  addProductToTable(product);

  document.getElementById("productName").value = "";
  document.getElementById("productQty").value = "";
  document.getElementById("buyPrice").value = "";
  document.getElementById("sellPrice").value = "";

  alert("Bidhaa imehifadhiwa!");
}

function addProductToTable(product) {
  let table = document.querySelector("table");
  let row = table.insertRow(-1);

  row.insertCell(0).innerHTML = product.name;
  row.insertCell(1).innerHTML = product.qty;
  row.insertCell(2).innerHTML =
    "TSh " + Number(product.sell).toLocaleString();
}

window.onload = function() {
  let products = JSON.parse(localStorage.getItem("nguuProducts")) || [];

  products.forEach(function(product) {
    addProductToTable(product);
  });
};
</script>

</body>
</html>
