<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguu Agrovet</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #168a45;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      padding: 18px;
      border: none;
      border-radius: 10px;
      background: #168a45;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>NGUU AGROVET</h1>
  <p>Kwediboma</p>
</header>

<div class="container">

  <div class="card">
    <h2>Dashboard</h2>
    <p>Karibu kwenye mfumo wa Nguu Agrovet.</p>
  </div>

  <div class="menu">
    <button>📦 STOCK</button>
    <button>🛒 NEW SALE</button>
    <button>🧾 RECEIPTS</button>
    <button>📊 DAILY SALES</button>
    <button>💰 PROFIT</button>
    <button>👥 CUSTOMERS</button>
  </div>

</div>

</body>
</html>
